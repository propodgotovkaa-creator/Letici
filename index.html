  panel.querySelector('.care-count').textContent='Готово '+size+' из '+total;
  panel.querySelector('.primary').disabled=size!==total;
  panel.querySelector('.keyboard').disabled=size===total;
}
function careNext(){
  if(state.done.size!==targets[state.action].length)return;
  if(state.action<4)state.action++;
  else if(state.person===0){state.person=1;state.action=0;}
  else{state.stage=1;state.person=0;}
  state.done.clear();keyboardIndex=0;pointer=null;dragging=false;renderPanel();
  panel.querySelector(state.stage===0?'.keyboard':'.person button').focus();
}
function carePanel(){
  heading(names[state.person]+' · '+actions[state.action]);
  paragraph(instructions[state.action]);
  const grid=document.createElement('div');grid.className='grid';
  actions.forEach((name,index)=>{
    const item=button(name,()=>scene.focus(),{pressed:index===state.action,disabled:index!==state.action});
    item.prepend(thumbnail(()=>tool(50,37,index,.92)));grid.append(item);
  });
  panel.append(grid);
  const progress=document.createElement('div');progress.className='progress';
  progress.setAttribute('role','progressbar');progress.setAttribute('aria-label',actions[state.action]);
  progress.setAttribute('aria-valuemin',0);progress.setAttribute('aria-valuemax',targets[state.action].length);
  progress.append(document.createElement('div'));panel.append(progress);
  const count=paragraph('','hint care-count');count.setAttribute('aria-live','polite');
  panel.append(button('Обработать следующую точку',keyboardCare,{className:'keyboard'}));
  const next=state.action<4?'Следующий инструмент':state.person===0?'Позвать Лео':'К причёскам';
  panel.append(button(next,careNext,{className:'primary',disabled:true}));
  updateCarePanel();
}
function hairPanel(){
  heading('Причёски');paragraph('Выбери укладку и цвет волос для Лети и Лео.');personPicker();
  const model=state.characters[state.person];
  const grid=document.createElement('div');grid.className='grid';
  options(grid,hairNames[state.person],model.hair,index=>choose(model,'hair',index,grid),index=>{
    ctx.translate(50,25);ctx.scale(.31,.31);
    hairBack(state.person,index,colors[model.color][1]);oval(0,68,62,65,'#edbc9e');
    hairFront(state.person,index,colors[model.color][1]);
  });
  panel.append(grid);label('Цвет волос');
  const palette=document.createElement('div');palette.className='palette';
  colors.forEach(([name,color],index)=>{
    const el=button('',()=>{
      choose(model,'color',index,palette);
      [...grid.children].forEach((item,i)=>item.replaceChild(thumbnail(()=>{
        ctx.translate(50,25);ctx.scale(.31,.31);hairBack(state.person,i,color);oval(0,68,62,65,'#edbc9e');hairFront(state.person,i,color);
      }),item.firstChild));
    },{pressed:index===model.color});
    el.style.background=color;el.title=name;el.setAttribute('aria-label',name);palette.append(el);
  });
  panel.append(palette,button('Открыть гардероб',()=>{state.stage=2;state.person=0;state.tab='dress';renderPanel();},{className:'primary'}));
}
function outfitIcon(tab,index){
  const color=clothing[tab][index][1];
  ctx.translate(50,38);
  if(tab==='dress'){ctx.scale(.17,.17);ctx.translate(0,-246);dress(index);}
  if(tab==='shoes'){shoe(-12,0,index);}
  if(tab==='crown'&&index){ctx.translate(0,12);ctx.scale(.67,.67);accessory(tab,index);}
  if(tab==='tie'&&index){ctx.scale(.8,.8);ctx.translate(0,-179);accessory(tab,index);}
  if((tab==='crown'||tab==='tie')&&!index){oval(0,0,14,14,null,'#b9a1b4',2);path('M-10 10L10-10',null,'#b9a1b4',2);}
  if(tab==='pants'){
    path('M-21-25H21L27 29H7L0-6-7 29H-27Z',color,'#43364c',2);
    path('M-17-17h34m-29 11l-4 28m28-28l4 28',null,'#ffffff50',2);
  }
  if(tab==='shirt'||tab==='suit'){
    path('M-15-24L-31-14-39 9-27 15-20 3-21 27H21L20 3 27 15 39 9 31-14 15-24Z',color,'#5c495f',2);
    path('M-15-24L0-12 15-24 10-3 0 10-10-3Z',tab==='suit'?'#e8ced9':'#ffffff90','#5c495f',1.5);
    for(let i=0;i<3;i++)oval(0,5+i*7,1.5,1.5,'#9c7481');
  }
}
function wardrobePanel(){
  heading('Гардероб');paragraph('Собери праздничный образ для каждого персонажа.');personPicker();
  const tabs=document.createElement('div');tabs.className='tabs';
  const keys=state.person===0?['dress','shoes','crown']:['suit','shirt','pants','tie','shoes'];
  options(tabs,keys.map(key=>labels[key]),keys.indexOf(state.tab),index=>{
    state.tab=keys[index];renderPanel();
    panel.querySelector('.tabs button[aria-pressed=true]').focus();
  });
  panel.append(tabs);
  const grid=document.createElement('div');grid.className='grid';
  const model=state.characters[state.person],tab=state.tab;
  options(grid,clothing[tab].map(([name])=>name),model[tab],index=>choose(model,tab,index,grid),index=>outfitIcon(tab,index));
  panel.append(grid,button('Выйти в сад',()=>{
    state.stage=3;ceremonyStart=performance.now();renderPanel();
  },{className:'primary'}));
}
function advanceRing(){
  if(state.stage!==3||state.ring===3)return;
  state.ring++;
  if(state.ring===2){burst(420,448,'spark',15);}
  if(state.ring===3){
    for(let i=0;i<6;i++)burst(235+i*90,150+i%2*48,'confetti',25);
  }
  renderPanel();panel.querySelector('.primary').focus();
}
function savePhoto(){
  draw();
  const link=document.createElement('a');link.download='letici-wedding.png';link.href=scene.toDataURL('image/png');link.click();
}
function ceremonyPanel(){
  heading(state.ring===3?'Свадебная фотография':'Под цветочной аркой');
  paragraph([
    'Лети и Лео ждут начала церемонии.',
    'Выбери левое кольцо на подушечке для Лети.',
    'Выбери правое кольцо на подушечке для Лео.',
    'Кольца надеты. Сохрани фотографию из сада.'
  ][state.ring]);
  const controls=['Начать церемонию','Надеть кольцо Лети','Надеть кольцо Лео','Сохранить фото'];
  panel.append(button(controls[state.ring],state.ring===3?savePhoto:advanceRing,{className:'primary'}));
}
function renderPanel(){
  panel.replaceChildren();steps.replaceChildren();
  chapters.forEach((name,index)=>{
    const step=document.createElement('span');step.textContent=name;
    if(index===state.stage){step.className='current';step.setAttribute('aria-current','step');}
    steps.append(step);
  });
  reset.hidden=state.stage===0&&state.person===0&&state.action===0&&state.done.size===0;
  [carePanel,hairPanel,wardrobePanel,ceremonyPanel][state.stage]();
}
function applyCare(x,y){
  if(state.stage!==0)return;
  const action=state.action;
  let updated=false;
  targets[action].forEach(([tx,ty],i)=>{
    const px=460+tx,py=157+ty;
    if(state.done.has(i)||Math.hypot(x-px,y-py)>21)return;
    state.done.add(i);updated=true;
    burst(px,py,action===1?'water':'spark',action===1?10:6);
  });
  if(updated){reset.hidden=false;updateCarePanel();}
}
function keyboardCare(){
  const points=targets[state.action];
  while(keyboardIndex<points.length&&state.done.has(keyboardIndex))keyboardIndex++;
  if(keyboardIndex===points.length)return;
  const [x,y]=points[keyboardIndex];applyCare(460+x,157+y);
  if(state.done.size===points.length)panel.querySelector('.primary').focus();
}
function position(event){
  const rect=scene.getBoundingClientRect();
  return {x:(event.clientX-rect.left)*W/rect.width,y:(event.clientY-rect.top)*H/rect.height};
}
scene.addEventListener('pointerdown',event=>{
  if(!event.isPrimary||event.button!==0)return;
  const p=position(event);
  if(state.stage===3&&(state.ring===1||state.ring===2)){
    const [x,y]=ringTargets[state.ring-1];
    if(Math.hypot(p.x-x,p.y-y)<31)advanceRing();
    return;
  }
  if(state.stage!==0)return;
  scene.setPointerCapture(event.pointerId);dragging=true;pointer=p;applyCare(p.x,p.y);
});
scene.addEventListener('pointermove',event=>{
  if(!dragging||!event.isPrimary||state.stage!==0)return;
  const p=position(event);
  const distance=Math.hypot(p.x-pointer.x,p.y-pointer.y),steps=Math.max(1,Math.ceil(distance/9));
  for(let i=1;i<=steps;i++)applyCare(pointer.x+(p.x-pointer.x)*i/steps,pointer.y+(p.y-pointer.y)*i/steps);
  pointer=p;
});
for(const name of ['pointerup','pointercancel','lostpointercapture']){
  scene.addEventListener(name,event=>{if(event.isPrimary){dragging=false;pointer=null;}});
}
scene.addEventListener('keydown',event=>{
  if(event.key!=='Enter'&&event.key!==' ')return;
  if(state.stage===0){event.preventDefault();keyboardCare();}
  if(state.stage===3&&state.ring<3){event.preventDefault();advanceRing();}
});
reset.addEventListener('click',()=>{
  if(window.confirm('Начать игру заново?')){fresh();panel.querySelector('.keyboard').focus();}
});
fresh();
requestAnimationFrame(frame);
</script>
</body>
</html>
